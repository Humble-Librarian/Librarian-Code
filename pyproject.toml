[project]
name = "librarian-code"
version = "0.1.0"
description = "A local-first CLI coding agent with persistent project memory"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.11.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "gitpython>=3.1.0",
    "pyfiglet>=1.0.0",
]

[project.scripts]
librarian = "librarian.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["librarian"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
